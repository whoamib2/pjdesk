# PJDesk Cloud — accounts + encrypted server sync, and the pjdesk.com website.
# Deployed from your PC with deploy.cmd (no CI).
name = "pjdesk-cloud"
main = "src/index.js"
compatibility_date = "2025-09-01"
# The pjdesk@spader.us Cloudflare account.
account_id = "499fcfb10813bb5555fa4547e726b466"
workers_dev = true

# pjdesk.com and www.pjdesk.com are served by this Worker (Cloudflare adds the
# DNS records and certificates for them on deploy).
routes = [
  { pattern = "pjdesk.com", custom_domain = true },
  { pattern = "www.pjdesk.com", custom_domain = true },
]

# The website (and account pages). The Worker handles /api/* and /download/*.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/download/*"]

[[d1_databases]]
binding = "DB"
database_name = "pjdesk-cloud"
database_id = "1f7d21b1-0851-49f5-b5c8-d6c4150f7f62"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SYNC"
bucket_name = "pjdesk-sync"

[vars]
# Accounts that can open /admin and always have cloud sync.
ADMIN_EMAILS = "ben@spader.us,pjdesk@spader.us"
# Where releases (and so the download links) come from.
RELEASE_REPO = "whoamib2/pjdesk"
