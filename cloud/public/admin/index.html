<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PJDesk admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="/"><span class="dot"></span>PJDesk</a>
    <span class="spacer"></span>
    <a class="link" href="/account/">Account</a>
    <a class="link on" href="/admin/">Admin</a>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Accounts</h1>
    <p class="sub">Turn Cloud Sync on for customers who have bought it. Administrators always have it.</p>
    <div class="card">
      <div class="row" style="margin-bottom:12px">
        <input id="filter" type="text" placeholder="Filter by email" style="max-width:320px">
        <span class="spacer"></span>
        <span id="count" class="muted"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Email</th><th>Created</th><th>Last sign-in</th><th>Signed in</th><th>Last backup</th><th>Cloud Sync</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="msg" class="msg"></div>
    </div>
  </div>
</main>

<script src="/app.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
