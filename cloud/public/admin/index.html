<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PJDesk admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="dark">
<div class="shell">
  <aside class="side">
    <a class="brand" href="/"><span class="dot"></span>PJDesk</a>
    <nav>
      <button type="button" data-page="overview" class="on">Overview</button>
      <button type="button" data-page="accounts">Accounts</button>
      <button type="button" data-page="servers">Servers &amp; devices</button>
      <button type="button" data-page="plans">Plans</button>
      <button type="button" data-page="audit">Audit log</button>
    </nav>
    <div class="side-foot">
      <button type="button" id="theme" class="ghost">Light</button>
      <a href="/account/">Account</a>
    </div>
  </aside>
  <main>
    <header class="top">
      <h1 id="title">Overview</h1>
      <p id="sub">Cloud Sync grants for pjdesk.com accounts.</p>
    </header>
    <section id="overview" class="page"></section>
    <section id="accounts" class="page hidden"></section>
    <section id="servers" class="page hidden"></section>
    <section id="plans" class="page hidden"></section>
    <section id="audit" class="page hidden"></section>
  </main>
</div>

<div id="grant" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="grant-title">
  <form class="dialog">
    <h2 id="grant-title">Grant a plan</h2>
    <p id="grant-who" class="muted"></p>
    <label>Plan
      <select id="grant-plan" name="plan">
        <option value="free">Free</option>
        <option value="cloud">Cloud Sync</option>
      </select>
    </label>
    <label>Expires (optional)
      <input id="grant-expires" name="expires" type="date">
    </label>
    <label>Note (optional)
      <input id="grant-note" name="note" type="text" maxlength="500" placeholder="Why this grant">
    </label>
    <p id="grant-msg" class="msg"></p>
    <div class="row">
      <button type="button" id="grant-cancel" class="ghost">Cancel</button>
      <span class="spacer"></span>
      <button type="submit" id="grant-save" class="primary">Save plan</button>
    </div>
  </form>
</div>

<div id="confirm" class="modal hidden" role="dialog" aria-modal="true">
  <form class="dialog">
    <h2>Change this plan?</h2>
    <p id="confirm-text"></p>
    <div class="row">
      <button type="button" id="confirm-no" class="ghost">Cancel</button>
      <span class="spacer"></span>
      <button type="submit" id="confirm-yes" class="danger">Change plan</button>
    </div>
  </form>
</div>

<script src="/app.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
