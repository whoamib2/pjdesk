[package]
name = "pjdesk"
description = "PJDesk remote desktop client: share this screen (host) or control another computer (controller)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pjdesk"
path = "src/main.rs"

[dependencies]
pjdesk-proto = { path = "../pjdesk-proto" }
pjdesk-link = { path = "../pjdesk-link" }
anyhow.workspace = true
ureq = { version = "2.10", default-features = false, features = ["tls"] }
clap.workspace = true
hex.workspace = true
postcard.workspace = true
quinn.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# H.264 encoder/decoder (Cisco OpenH264, compiled from source; uses NASM for
# SIMD when it's on PATH, plain C++ otherwise).
openh264 = "0.9"
# Viewer window + CPU framebuffer.
winit = "0.30"
softbuffer = "0.4"
rpassword = "7"
# Main window + settings GUI.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
glow = "0.17"
arboard = { version = "3", default-features = false }
# Viewer toolbar text (font bytes are already in the tree via egui).
ab_glyph = "0.2"
epaint_default_fonts = "0.36"
# Clipboard images are PNG. Text stays on the control stream.
png = "0.17"
# Headless UI snapshots (`--features ui-shots`). Not linked into the app.
egui_kittest = { version = "0.36", optional = true, features = ["wgpu", "snapshot", "eframe"] }

[features]
ui-shots = ["dep:egui_kittest"]

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_WinRT",
    "Security_Credentials_UI",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
]

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
windows-service = "0.8"
# System-tray icon + menu (minimize-to-tray, Show/Quit).
tray-icon = "0.26"
# UI Automation so a password manager can see the account email and password fields.
eframe = { version = "0.36", default-features = false, features = ["accesskit"] }

[build-dependencies]
# Embeds the app icon + version metadata into the Windows .exe.
winresource = "0.1"
