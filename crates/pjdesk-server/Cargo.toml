[package]
name = "pjdesk-server"
description = "PJDesk signaling, rendezvous and relay server (runs as a console app or Windows service)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pjdesk-proto = { path = "../pjdesk-proto" }
anyhow.workspace = true
postcard.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Password hashing for server accounts.
argon2 = "0.5"
# Console password prompt for `account add`.
rpassword = "7"
# Local date/time for "last seen" in the management window.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
arboard = { version = "3", default-features = false }
# Headless UI snapshots (`--features ui-shots`). Not linked into the app.
egui_kittest = { version = "0.36", optional = true, features = ["wgpu", "snapshot", "eframe"] }
# Cloud sync (Cloudflare R2 / S3): HTTPS, request signing, sealing, encoding.
ureq = { version = "2.10", default-features = false, features = ["tls"] }
hmac.workspace = true
ring = "0.17"
base64 = "0.22"

[features]
ui-shots = ["dep:egui_kittest"]

[target.'cfg(unix)'.dependencies]
# x11/wayland are what let egui build on Linux. They are not part of the Windows build.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
windows-service = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Time",
] }
# System-tray icon + menu for the management window.
tray-icon = "0.26"

[build-dependencies]
# Embeds the server icon + version metadata into the Windows .exe.
winresource = "0.1"
