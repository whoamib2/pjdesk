[package]
name = "desklink"
description = "DeskLink remote desktop client: share this screen (host) or control another computer (controller)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "desklink"
path = "src/main.rs"

[dependencies]
desklink-proto = { path = "../desklink-proto" }
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
postcard.workspace = true
quinn.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# H.264 encoder/decoder (Cisco OpenH264, compiled from source; uses NASM for
# SIMD when it's on PATH, plain C++ otherwise).
openh264 = "0.9"
# Viewer window + CPU framebuffer.
winit = "0.30"
softbuffer = "0.4"
rpassword = "7"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
