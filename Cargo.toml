[workspace]
resolver = "2"
members = [
    "crates/pjdesk-proto",
    "crates/pjdesk-link",
    "crates/pjdesk-server",
    "crates/pjdesk",
    "crates/pjdesk-mobile",
]

[workspace.package]
version = "0.6.68"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/whoamib2/pjdesk"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
postcard = { version = "1", features = ["use-std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spake2 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Pixel loops (color conversion, scaling) and the H.264 codec are unusably
# slow without optimization, so keep dependencies optimized even in debug.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
