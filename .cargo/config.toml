# Link the C runtime statically on Windows, so pjdesk.exe and
# pjdesk-server.exe run on any PC without installing the VC++ redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
